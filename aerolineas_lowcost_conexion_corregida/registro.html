<!DOCTYPE html>
<html lang="es">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title>
   Crear cuenta | Aerol&iacute;neas Low Cost
  </title>
  <link href="styles.css" rel="stylesheet"/>
 </head>
 <body>
  <header class="topbar">
   <a class="brand" href="index.html">
    <span class="brand-mark">
     ✈
    </span>
    <span>
     Aerol&iacute;neas
     <span class="brand-light">
      Low Cost
     </span>
    </span>
   </a>
   <nav class="main-nav">
    <a href="index.html">
     Buscar vuelos
    </a>
    <a href="mis-viajes.html">
     Mis viajes
    </a>
    <a href="checkin.html">
     Check-in
    </a>
   </nav>
   <div class="account-actions">
    <a class="btn btn-quiet" href="login.html">
     Iniciar sesi&oacute;n
    </a>
   </div>
  </header>
  <main class="auth-wrap">
   <form class="auth-card" id="formulario-registro">
    <span class="eyebrow">
     EMPEZ&Aacute; A PLANEAR
    </span>
    <h1>
     Cre&aacute; tu cuenta
    </h1>
    <p>
     Registrate para guardar tus datos y administrar tus reservas.
    </p>
    <label class="field">
     Nombre y apellido
     <input autocomplete="name" id="nombre" required=""/>
    </label>
    <label class="field">
     Pasaporte o documento
     <input id="pasaporte" required=""/>
    </label>
    <label class="field">
     Correo electr&oacute;nico
     <input autocomplete="email" id="email" required="" type="email"/>
    </label>
    <label class="field">
     Tel&eacute;fono (opcional)
     <input autocomplete="tel" id="telefono" type="tel"/>
    </label>
    <label class="field">
     N&uacute;mero de viajero frecuente (opcional)
     <input id="viajero_frecuente"/>
    </label>
    <label class="field">
     Contrase&ntilde;a (m&iacute;nimo 8 caracteres)
     <input autocomplete="new-password" id="contrasena" minlength="8" required="" type="password"/>
    </label>
    <div aria-live="polite" class="message" id="auth-message">
    </div>
    <button class="btn btn-primary" type="submit">
     Crear cuenta
    </button>
    <div class="auth-note">
     Al registrarte, tus datos se guardar&aacute;n para gestionar tus viajes.
    </div>
   </form>
  </main>
  <footer class="footer">
   <a href="index.html">
    &larr; Volver al inicio
   </a>
   <span>
    Proteg&eacute; tu contrase&ntilde;a y no la compartas.
   </span>
  </footer>
  <script src="registro.js">
  </script>
 </body>
</html>
